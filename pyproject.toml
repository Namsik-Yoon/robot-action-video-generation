[project]
name = "robot-action-video-generation"
version = "0.1.0"
description = "Minimal data exploration for DACON 236736"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pillow>=11,<13", "pyarrow>=19,<24"]

[dependency-groups]
notebook = [
    "av>=14,<17",
    "jupyterlab>=4,<5",
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<4",
]

[tool.uv]
package = false
